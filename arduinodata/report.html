<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" rel="stylesheet">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Records</title>
    <style>
        body {
            display: flex;
            font-family: Arial, sans-serif;
            margin: 0;
        }
        #sidebar {
            width: 250px;
            background-color: #2c3e50;
            color: white;
            transition: width 0.3s;
            overflow: hidden;
            position: fixed; /* Keep sidebar fixed on the left */
            height: 100vh; /* Full height */
            left: 0; /* Align to the left */
        }
        #sidebar.active {
            width: 50px; /* Collapsed width */
        }
        #sidebar ul {
            list-style: none;
            padding: 0;
        }
        #sidebar ul li {
            padding: 15px;
            cursor: pointer;
            text-align: center;
        }
        #sidebar ul li a {
            color: white; /* Change link color to white */
            text-decoration: none; /* Remove underline */
            display: flex; /* Use flexbox for alignment */
            align-items: center; /* Center items vertically */
            justify-content: center; /* Center items horizontally */
        }
        #sidebar ul li:hover {
            background-color: #34495e;
        }
        #sidebar ul li a:hover {
            text-decoration: underline; /* Optional: Add underline on hover */
            color: #ddd; /* Optional: Change color on hover */
        }
        #toggle-btn {
            padding: 15px; /* Add padding for space */
            text-align: center;
            cursor: pointer;
        }
        #content {
            flex-grow: 1;
            padding: 20px;
            margin-left: 250px; /* Ensure content starts after sidebar */
            transition: margin-left 0.3s; /* Smooth transition */
        }
        #sidebar.active + #content {
            margin-left: 50px; /* Adjust margin when sidebar is collapsed */
        }
        .link-text {
            margin-left: 10px; /* Space between icon and text */
            display: inline; /* Default to show text */
        }
        #sidebar.active .link-text {
            display: none; /* Hide text when collapsed */
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
        }
        th {
            background-color: #f2f2f2;
        }
        .pagination {
            margin-top: 20px;
        }
        .pagination button {
            padding: 8px 12px;
            border: 1px solid #ddd;
            cursor: pointer;
        }
        .disabled {
            color: gray;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

    <div id="sidebar">
        <ul>
            <li id="toggle-btn" class="toggle-btn"><i class="fas fa-bars"></i></li>
            <li>
                <a href="testdash.html">
                    <i class="fas fa-tachometer-alt"></i>
                    <span class="link-text">Dashboard</span>
                </a>
            </li>
            <li>
                <a href="testform.html">
                    <i class="fas fa-sliders-h"></i>
                    <span class="link-text">Thresholds</span>
                </a>
            </li>
            <li>
                <a href="report.html">
                    <i class="fas fa-file-alt"></i>
                    <span class="link-text">Reports</span>
                </a>
            </li>
            <li>
                <a href="userlog.html">
                    <i class="fas fa-users"></i>
                    <span class="link-text">Users</span>
                </a>
            </li>
            <li>
                <a href="logout.php">
                    <i class="fas fa-sign-out-alt"></i>
                    <span class="link-text">Sign Out</span>
                </a>
            </li>
        </ul>
    </div>

    <div id="content"> <!-- Content wrapper -->
        <h2>Plant Records</h2>
        <table id="records-table">
            <thead>
                <tr>
                    <th>Temperature</th>
                    <th>Moisture</th>
                    <th>Probability</th>
                    <th>Collected</th>
                </tr>
            </thead>
            <tbody id="data-body">
                <!-- Data will be inserted here -->
            </tbody>
        </table>

        <div class="pagination" id="pagination-controls">
            <button id="prev-button" class="disabled" disabled>Previous</button>
            <button id="next-button">Next</button>
        </div>
    </div>

    <script>
        let currentPage = 1; // Track the current page
        let totalPages = 0; // Track total pages

        function fetchData(page) {
            fetch(`http://localhost/arduinodata/fetch_data.php?page=${page}`)
                .then(response => response.json())
                .then(data => {
                    const dataBody = document.getElementById('data-body');
                    dataBody.innerHTML = ''; // Clear existing data

                    data.data.forEach(item => {
                        const row = document.createElement('tr');
                        row.innerHTML = `<td>${item.temperature}</td><td>${item.moisture}</td><td>${item.probability}</td><td>${item.collected}</td>`;
                        dataBody.appendChild(row);
                    });

                    // Update total pages and current page
                    totalPages = data.totalPages;
                    currentPage = data.currentPage;

                    // Enable or disable buttons based on the current page
                    document.getElementById('prev-button').classList.toggle('disabled', currentPage === 1);
                    document.getElementById('prev-button').disabled = currentPage === 1;

                    document.getElementById('next-button').classList.toggle('disabled', currentPage >= totalPages);
                    document.getElementById('next-button').disabled = currentPage >= totalPages;
                })
                .catch(error => console.error('Error fetching data:', error));
        }

        document.getElementById('next-button').onclick = function() {
            if (currentPage < totalPages) {
                fetchData(currentPage + 1);
            }
        };

        document.getElementById('prev-button').onclick = function() {
            if (currentPage > 1) {
                fetchData(currentPage - 1);
            }
        };

        // Toggle sidebar visibility
        document.getElementById('toggle-btn').onclick = function() {
            const sidebar = document.getElementById('sidebar');
            sidebar.classList.toggle('active');
        };

        // Fetch the first page of data on load
        window.onload = function() {
            fetchData(1);
        };
    </script>
</body>
</html>
